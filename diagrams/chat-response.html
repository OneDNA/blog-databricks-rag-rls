<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two questions, two enforcement paths — per-user retrieval on a governed corpus</title>
<style>
  /* Databricks brand tokens.
     Green is the semantic green #00A972 / #00875C. The palette has no teal, turquoise
     or mint — an earlier draft used #71C5AD, which is off-brand. */
  :root {
    --lava:      #FF5F46;   /* Lava 500 — your code enforces */
    --lava-deep: #FF3621;   /* Lava 600 — the break, the denial */
    --lava-tint: #FABFBA;
    --navy:      #143D4A;   /* Navy 700 */
    --navy-deep: #1B3139;   /* Navy 800 — body text */
    --navy-soft: #618794;   /* secondary text */
    --oat-line:  #D9D7CE;
    --oat:       #EEEDE9;   /* Oat Medium */
    --oat-light: #F9F7F4;   /* Oat Light */
    --white:     #FFFFFF;
    --green:     #00A972;   /* semantic green — Unity Catalog enforces */
    --green-700: #00875C;
    --green-tint:#D5F0E4;

    --bg:        var(--oat-light);
    --surface:   var(--white);
    --ink:       var(--navy-deep);
    --ink-soft:  var(--navy-soft);
    --rule:      var(--oat-line);
    --bubble-in: var(--oat);
    --ok-ink:    var(--green-700);
    --ok-bg:     var(--green-tint);
    --no-ink:    #9A2412;
    --no-bg:     var(--lava-tint);

    --font: "DM Sans", "DM Sans 14pt", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B2026; --surface: #142E37; --ink: #E8EFF1; --ink-soft: #9DB4BC;
      --rule: #26454F; --bubble-in: #1B3D48;
      --ok-ink: #5FDCAB; --ok-bg: #0B4433; --no-ink: #FFC7BF; --no-bg: #4A1A12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B2026; --surface: #142E37; --ink: #E8EFF1; --ink-soft: #9DB4BC;
    --rule: #26454F; --bubble-in: #1B3D48;
    --ok-ink: #5FDCAB; --ok-bg: #0B4433; --no-ink: #FFC7BF; --no-bg: #4A1A12;
  }
  :root[data-theme="light"] {
    --bg: #F9F7F4; --surface: #FFFFFF; --ink: #1B3139; --ink-soft: #618794;
    --rule: #D9D7CE; --bubble-in: #EEEDE9;
    --ok-ink: #00875C; --ok-bg: #D5F0E4; --no-ink: #9A2412; --no-bg: #FABFBA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1rem, 3vw, 2rem);
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 74rem; margin: 0 auto; }

  .controls {
    display: flex; align-items: center; justify-content: flex-end;
    margin: 0 0 0.75rem;
  }
  button.replay {
    font: inherit; font-size: 0.8rem; font-weight: 700;
    color: var(--ink-soft); background: transparent;
    border: 1px solid var(--rule); border-radius: 8px;
    padding: 0.3rem 0.75rem; cursor: pointer;
  }
  button.replay:hover { color: var(--ink); border-color: var(--ink-soft); }
  button.replay:focus-visible { outline: 2px solid var(--navy-soft); outline-offset: 2px; }

  /* Two chats side by side, one per caller. Each runs both questions. */
  .panes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem;
    align-items: start;
  }
  @media (max-width: 60rem) { .panes { grid-template-columns: minmax(0, 1fr); } }

  .pane {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .pane-head {
    display: flex; align-items: center; gap: 0.65rem;
    padding: 0.9rem 1rem; border-bottom: 1px solid var(--rule);
  }
  .avatar {
    flex: none; width: 2rem; height: 2rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.78rem; font-weight: 700;
    background: var(--oat); color: var(--navy-deep); border: 1px solid var(--rule);
  }
  .who { min-width: 0; }
  .who .name { font-weight: 700; font-size: 0.925rem; }
  .who .group {
    font-family: var(--mono); font-size: 0.75rem;
    color: var(--ink-soft); overflow-wrap: anywhere;
  }

  .thread {
    padding: 1rem; display: flex; flex-direction: column;
    gap: 0.55rem; flex: 1;
  }

  .row { display: flex; }
  .row.from-user { justify-content: flex-end; }
  .row.from-bot  { justify-content: flex-start; }

  .bubble {
    max-width: 92%; padding: 0.6rem 0.8rem;
    border-radius: 12px; font-size: 0.875rem;
  }
  /* The user bubble is right-aligned, so a bubble that grows with its text would
     extend leftwards and read as if typed right-to-left. Fixing the width up front
     keeps the left edge still and lets characters fill rightwards. */
  .bubble.user {
    background: var(--bubble-in); border-bottom-right-radius: 4px;
    width: 92%; text-align: left;
  }
  .bubble.bot {
    background: var(--bg); border: 1px solid var(--rule);
    border-bottom-left-radius: 4px;
  }
  /* Border on the reply says who enforced THAT exchange, not who the caller is. */
  .bubble.bot.uc  { border-left: 3px solid var(--green); }
  .bubble.bot.acl { border-left: 3px solid var(--lava); }
  .bubble p { margin: 0 0 0.5rem; }
  .bubble p:last-child { margin-bottom: 0; }

  .caret {
    display: inline-block; width: 2px; height: 1em;
    background: var(--ink); vertical-align: -0.15em; margin-left: 1px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .dots { display: inline-flex; gap: 0.22rem; padding: 0.1rem 0; }
  .dots i {
    width: 0.4rem; height: 0.4rem; border-radius: 50%;
    background: var(--ink-soft); animation: bounce 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-3px); }
  }

  .cites { margin-top: 0.4rem; }
  .cite {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 0.7rem; color: var(--ink-soft);
    background: var(--bubble-in); border: 1px solid var(--rule);
    border-radius: 999px; padding: 0.1rem 0.5rem; margin: 0.15rem 0.25rem 0 0;
  }

  /* Metadata box, tucked under the reply it belongs to. */
  .trace {
    align-self: flex-start;
    width: 92%;
    margin: 0.1rem 0 0.2rem;
    padding: 0.5rem 0.7rem;
    background: var(--bg);
    border: 1px dashed var(--rule);
    border-left: 3px solid var(--edge, var(--rule));
    border-radius: 8px;
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    gap: 0.2rem 0.7rem;
    font-family: var(--mono); font-size: 0.72rem;
    align-items: baseline;
    opacity: 0; transition: opacity 0.35s ease;
  }
  .trace.uc  { --edge: var(--green); }
  .trace.acl { --edge: var(--lava); }
  .trace.shown { opacity: 1; }
  .trace dt { color: var(--ink-soft); }
  .trace dd { margin: 0; overflow-wrap: anywhere; }

  .pill {
    display: inline-block; padding: 0 0.4rem;
    border-radius: 4px; font-weight: 700; border: 1px solid transparent;
  }
  .pill.ok   { color: var(--ok-ink); background: var(--ok-bg); border-color: var(--green); }
  .pill.zero { color: var(--no-ink); background: var(--no-bg); border-color: var(--lava); }

  @media (prefers-reduced-motion: reduce) {
    .caret, .dots i { animation: none; }
    .trace { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="controls">
    <button class="replay" type="button" id="replay">Replay</button>
  </div>

  <div class="panes">

    <section class="pane" aria-label="Caller entitled to Water Delta">
      <div class="pane-head">
        <div class="avatar" aria-hidden="true">AC</div>
        <div class="who">
          <div class="name">Alice Chen</div>
          <div class="group">group-water-delta</div>
        </div>
      </div>
      <div class="thread" id="thread-allow" aria-live="polite"></div>
    </section>

    <section class="pane" aria-label="Caller entitled to a different project">
      <div class="pane-head">
        <div class="avatar" aria-hidden="true">DP</div>
        <div class="who">
          <div class="name">David Park</div>
          <div class="group">group-coastal-north</div>
        </div>
      </div>
      <div class="thread" id="thread-deny" aria-live="polite"></div>
    </section>

  </div>

</div>

<script>
(function () {
  "use strict";

  // Q1 quantitative -> structured -> Genie -> Unity Catalog enforces (green).
  // Q2 qualitative  -> documents  -> AI Search -> our own ACL enforces (lava).
  var Q1 = "How many hours did we book on the Water Delta project in Q2?";
  var Q2 = "What went wrong on Water Delta, and what did we learn from it?";

  var THREADS = {
    allow: {
      thread: "thread-allow",
      turns: [
        {
          leg: "uc", q: Q1, think: 1600,
          reply: "We booked 1,240 hours on Water Delta in Q2, across eight timesheet entries. " +
                 "Hydraulic modelling took the biggest share at 380 hours.",
          cites: [],
          trace: [
            ["path", "Genie → SQL warehouse"],
            ["enforced by", "Unity Catalog row filter"],
            ["executed_as", "alice.chen@example.com"],
            ["rows", "8", "ok"],
            ["obo_active", "true", "ok"]
          ]
        },
        {
          leg: "acl", q: Q2, think: 1900,
          reply: "Two things, from the retrospective and the closeout note. The bathymetry survey " +
                 "arrived three weeks late, which pushed the modelling window into the freeze " +
                 "period. And the team carried a spreadsheet handover between two consultants " +
                 "that nobody had reviewed.",
          cites: ["retro-q2.md · chunk 7", "closeout.md · chunk 2"],
          trace: [
            ["path", "AI Search index"],
            ["enforced by", "our entitlement filter"],
            ["filter", '{"project_group": "water-delta"}'],
            ["chunks", "6", "ok"],
            ["obo_active", "true", "ok"]
          ]
        }
      ]
    },
    deny: {
      thread: "thread-deny",
      turns: [
        {
          leg: "uc", q: Q1, think: 1400,
          reply: "I ran the query, but it came back empty. Your access covers Coastal North, and " +
                 "the hours table holds no Water Delta rows you can read.",
          cites: [],
          trace: [
            ["path", "Genie → SQL warehouse"],
            ["enforced by", "Unity Catalog row filter"],
            ["executed_as", "david.park@example.com"],
            ["rows", "0", "zero"],
            ["obo_active", "true", "ok"]
          ]
        },
        {
          leg: "acl", q: Q2, think: 1700,
          reply: "Nothing came back for that one either. I searched the documents you're " +
                 "entitled to, which is Coastal North, and none of them cover Water Delta. Ask " +
                 "your project manager to have you added to the group.",
          cites: [],
          trace: [
            ["path", "AI Search index"],
            ["enforced by", "our entitlement filter"],
            ["filter", '{"project_group": "coastal-north"}'],
            ["chunks", "0", "zero"],
            ["obo_active", "true", "ok"]
          ]
        }
      ]
    }
  };

  // Typing speeds, in ms per burst. Slower than a real person so the sequence reads.
  var ASK_SPEED   = 55;
  var REPLY_SPEED = 30;
  var CHARS_PER_TICK = 1;

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timers = [];
  function after(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    return n;
  }

  function addBubble(thread, who, extra) {
    var row = el("div", "row from-" + (who === "user" ? "user" : "bot"));
    var bubble = el("div", "bubble " + who + (extra ? " " + extra : ""));
    row.appendChild(bubble);
    thread.appendChild(row);
    return bubble;
  }

  function addCites(bubble, cites) {
    if (!cites.length) { return; }
    var wrap = el("p", "cites");
    cites.forEach(function (c) {
      var pill = el("span", "cite");
      pill.textContent = c;
      wrap.appendChild(pill);
    });
    bubble.appendChild(wrap);
  }

  function addTrace(thread, turn) {
    var dl = el("dl", "trace " + turn.leg);
    turn.trace.forEach(function (r) {
      var dt = el("dt"); dt.textContent = r[0];
      var dd = el("dd");
      if (r[2]) {
        var pill = el("span", "pill " + r[2]);
        pill.textContent = r[1];
        dd.appendChild(pill);
      } else {
        dd.textContent = r[1];
      }
      dl.appendChild(dt); dl.appendChild(dd);
    });
    thread.appendChild(dl);
    return dl;
  }

  function type(node, text, speed, done) {
    var span = el("span");
    var caret = el("span", "caret");
    node.appendChild(span);
    node.appendChild(caret);
    var i = 0;
    (function step() {
      if (i >= text.length) { caret.remove(); done(); return; }
      span.textContent = text.slice(0, (i += CHARS_PER_TICK));
      after(speed, step);
    })();
  }

  // Play one question/answer exchange, then hand off to the next.
  function playTurn(thread, turn, done) {
    var ask = addBubble(thread, "user");

    type(ask, turn.q, ASK_SPEED, function () {
      var pending = addBubble(thread, "bot", turn.leg);
      var dots = el("span", "dots");
      dots.innerHTML = "<i></i><i></i><i></i>";
      pending.appendChild(dots);

      after(turn.think, function () {
        pending.textContent = "";
        type(pending, turn.reply, REPLY_SPEED, function () {
          addCites(pending, turn.cites);
          var tr = addTrace(thread, turn);
          after(150, function () { tr.classList.add("shown"); });
          after(1100, done);
        });
      });
    });
  }

  function run(cfg) {
    var thread = document.getElementById(cfg.thread);
    thread.textContent = "";

    if (reduced) {
      cfg.turns.forEach(function (turn) {
        addBubble(thread, "user").textContent = turn.q;
        var b = addBubble(thread, "bot", turn.leg);
        b.appendChild(document.createTextNode(turn.reply));
        addCites(b, turn.cites);
        addTrace(thread, turn).classList.add("shown");
      });
      return;
    }

    var i = 0;
    (function next() {
      if (i >= cfg.turns.length) { return; }
      playTurn(thread, cfg.turns[i++], next);
    })();
  }

  function playAll() {
    timers.forEach(clearTimeout);
    timers = [];
    run(THREADS.allow);
    run(THREADS.deny);
  }

  document.getElementById("replay").addEventListener("click", playAll);
  playAll();
})();
</script>
</body>
</html>
